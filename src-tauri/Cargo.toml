[package]
name = "carbon"
version = "0.1.13"
description = "A local-first clipboard manager for Windows"
authors = ["Sanirudh"]
edition = "2021"

[lib]
name = "carbon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
image = "0.25"
base64 = "0.22"
directories = "5"
lazy_static = "1.4"
log = "0.4"
env_logger = "0.11"
html2md = "0.2.15"
quircs = "0.10.3"
url = "2.5"
sha2 = "0.10"
hex = "0.4"
window-vibrancy = "0.8.0"

# Direct handle on the WebView2 COM API: force the controller's
# DefaultBackgroundColor to fully transparent at creation (white-flash fix,
# see vibrancy.rs + webview_bg.rs). Kept in lockstep with the webview2-com
# version wry already pulls in (Cargo.lock: 0.38.x) so no second copy is compiled.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
# Same version family webview2-com-sys 0.38 uses (0.61) so the
# windows_core::Interface cast trait unifies with the controller() handle.
windows-core = "0.61"


